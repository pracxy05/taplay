spring.application.name=taplay-backend
server.port=8080

# Local Embedded H2 Database (Runs inside JVM on CachyOS without installing SQL server)
spring.datasource.url=jdbc:h2:mem:taplaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Python Fraud Detection Microservice URL
taplay.fraud-service.url=http://localhost:5000/predict
